<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área del ciclo Stirling</title>
<style>
  :root { --fg:#111; --mut:#5f6368; --line:#d6d6d6; --acc:#1f5fbf; }
  html, body { margin:0; height:100%; background:#fff; color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap;
    padding:8px 16px; border-bottom:1px solid var(--line); font-size:17px; }
  h1 { font-size:20px; font-weight:600; margin:0 6px 0 0; }
  button { font:inherit; font-size:16px; padding:6px 14px; border:1px solid #b5b5b5;
    border-radius:6px; background:#fafafa; color:var(--fg); cursor:pointer; }
  button:hover { background:#f0f0f0; }
  button.prim { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.prim:hover { background:#184f9f; }
  button:disabled { opacity:.4; cursor:default; }
  label { display:flex; align-items:center; gap:6px; color:var(--mut); }
  input[type=number] { font:inherit; font-size:16px; width:3.8em; padding:3px 6px;
    border:1px solid #bbb; border-radius:5px; }
  #fname { font-weight:600; max-width:16em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sep { flex:1; }
  #info { color:var(--mut); font-size:15px; padding:4px 16px; border-bottom:1px solid #eee; min-height:20px; }
  main { flex:1; display:grid; grid-template-rows:45fr 55fr; min-height:0; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; min-height:0; }
  .plot { position:relative; min-height:0; min-width:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #cvTop { cursor:crosshair; touch-action:none; }
  #drop { position:fixed; inset:0; background:rgba(31,95,191,.08); border:3px dashed var(--acc);
    display:none; align-items:center; justify-content:center; font-size:26px; color:var(--acc); pointer-events:none; }
</style>
</head>
<body>
<header>
  <h1>Área del ciclo Stirling</h1>
  <button class="prim" id="bOpen">Abrir archivo .txt</button>
  <input type="file" id="file" accept=".txt,.dat,.csv,text/plain" hidden>
  <span id="fname">ningún archivo</span>
  <button class="prim" id="bCalc" disabled>Calcular área (Enter)</button>
  <button id="bClr" disabled>Borrar selección</button>
  <button id="bAll" disabled>Ver todo</button>
  <span class="sep"></span>
  <label>Columna V <input type="number" id="colV" value="3" min="1" step="1"></label>
  <label>Columna P <input type="number" id="colP" value="5" min="1" step="1"></label>
  <label>Suavizado <input type="number" id="span" value="100" min="1" step="1"></label>
</header>
<div id="info">Abre el archivo de datos del motor (texto separado por tabuladores, 9 líneas de cabecera).</div>
<main>
  <div class="plot" id="top"><canvas id="cvTop"></canvas></div>
  <div class="row2">
    <div class="plot"><canvas id="cvA"></canvas></div>
    <div class="plot"><canvas id="cvB"></canvas></div>
  </div>
</main>
<div id="drop">Suelta aquí el archivo .txt</div>

<script>
"use strict";
// ---------------- Parámetros del programa original ----------------
const HEADER_LINES = 9;          // headerlinesIn = 9
const FACT_V = 2.4 * 1e-9;       // mV -> m^3   (1 V = 2.4 cm^3)
const FACT_P = 329 * 0.1;        // mV -> Pa    (1 V = 329 hPa)
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';

// ---------------- Estado ----------------
let cols = null;        // columnas numéricas del archivo (equivalente a A.data)
let V = null, P = null, N = 0;   // datos convertidos (m^3, Pa)
let picks = [];         // coordenadas x pinchadas (como ginput)
let view = { x0: 1, x1: 1 };
let hoverX = null;
let topLay = null;      // geometría del último dibujo del gráfico superior
let result = null;

const $ = id => document.getElementById(id);
const cvTop = $('cvTop'), cvA = $('cvA'), cvB = $('cvB');

// ---------------- Lectura del archivo (equivalente a importdata) ----------------
function parseNum(s) {
  s = s.trim();
  if (s === '') return NaN;
  if (/^[+-]?\d*,\d+([eE][+-]?\d+)?$/.test(s)) s = s.replace(',', '.');
  if (!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s) && !/^[+-]?(Inf|NaN)$/i.test(s)) return NaN;
  return s.toLowerCase().includes('inf') ? (s[0] === '-' ? -Infinity : Infinity) : Number(s);
}

function parseFile(text) {
  const lines = text.split(/\r\n|\n|\r/);
  const rows = [];
  for (let i = HEADER_LINES; i < lines.length; i++) {
    if (lines[i].trim() !== '') rows.push(lines[i].split('\t'));
  }
  if (!rows.length) throw new Error('No hay datos después de las ' + HEADER_LINES + ' líneas de cabecera.');
  // como importdata: las columnas de texto iniciales van a textdata, no a data
  let lead = 0;
  while (lead < rows[0].length && isNaN(parseNum(rows[0][lead]))) lead++;
  let nc = 0;
  for (const r of rows) {
    let k = r.length;
    while (k > lead && r[k - 1].trim() === '') k--;
    nc = Math.max(nc, k - lead);
  }
  if (nc <= 0) throw new Error('No se encontraron columnas numéricas tras la cabecera.');
  const out = Array.from({ length: nc }, () => new Float64Array(rows.length));
  rows.forEach((r, j) => {
    for (let c = 0; c < nc; c++) {
      const s = r[lead + c];
      out[c][j] = s === undefined ? NaN : parseNum(s);
    }
  });
  return out;
}

// ---------------- Funciones numéricas ----------------
// smooth(y, span) de MATLAB, método 'moving': media móvil centrada; span par -> span-1;
// en los extremos la ventana se reduce de forma simétrica (yy(1)=y(1), yy(2)=(y1+y2+y3)/3, ...)
function smoothMA(y, span) {
  const n = y.length;
  span = Math.floor(span);
  if (span > n) span = n;
  if (span % 2 === 0) span--;
  if (span < 1) span = 1;
  const h = (span - 1) / 2;
  const cs = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) cs[i + 1] = cs[i] + y[i];
  const out = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const k = Math.min(h, i, n - 1 - i);
    out[i] = (cs[i + k + 1] - cs[i - k]) / (2 * k + 1);
  }
  return out;
}

// polyarea de MATLAB (fórmula del área de Gauss, polígono cerrado automáticamente)
function polyarea(x, y) {
  const n = x.length;
  if (n < 3) return 0;
  let mx = 0, my = 0;
  for (let i = 0; i < n; i++) { mx += x[i]; my += y[i]; }
  mx /= n; my /= n;                     // centrado: mismo área, menos error de redondeo
  let s = 0;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    s += (x[i] - mx) * (y[j] - my) - (x[j] - mx) * (y[i] - my);
  }
  return Math.abs(s) / 2;
}

// num2str(x, 4)  ->  formato '%.4g'
function num2str4(v) {
  if (!isFinite(v)) return isNaN(v) ? 'NaN' : (v > 0 ? 'Inf' : '-Inf');
  if (v === 0) return '0';
  let s = v.toExponential(3);
  let [m, ex] = s.split('e');
  const e = parseInt(ex, 10);
  if (e < -4 || e >= 4) {
    m = m.replace(/\.?0+$/, '');
    return m + 'e' + (e < 0 ? '-' : '+') + String(Math.abs(e)).padStart(2, '0');
  }
  s = v.toFixed(Math.max(0, 3 - e));
  if (s.includes('.')) s = s.replace(/\.?0+$/, '');
  return s;
}

// ---------------- Dibujo de gráficos ----------------
function setupCanvas(cv) {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  const W = Math.max(1, Math.round(r.width * d)), H = Math.max(1, Math.round(r.height * d));
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  return { ctx, w: r.width, h: r.height };
}

function niceTicks(a, b, maxT) {
  if (!(b > a)) return { ticks: [a], step: 1 };
  const raw = (b - a) / maxT, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const k0 = Math.ceil(a / step - 1e-9), k1 = Math.floor(b / step + 1e-9);
  const t = [];
  for (let k = k0; k <= k1; k++) t.push(k * step);
  return { ticks: t, step };
}

function niceLimits(min, max) {
  if (!isFinite(min) || !isFinite(max)) return [0, 1];
  if (min === max) { const d = Math.abs(min) || 1; return [min - d * 0.05, max + d * 0.05]; }
  const pad = (max - min) * 0.04;
  return [min - pad, max + pad];
}

function tickFormat(ticks, step) {
  if (!ticks.length) return { labels: [], e: 0 };
  const mx = Math.max(...ticks.map(Math.abs));
  let e = 0;
  if (mx > 0) { const lg = Math.floor(Math.log10(mx) + 1e-12); if (lg >= 4 || lg <= -3) e = lg; }
  const sc = Math.pow(10, e), st = step / sc;
  let d = Math.max(0, -Math.floor(Math.log10(st) + 1e-9));
  if (Math.abs(Math.round(st * Math.pow(10, d)) - st * Math.pow(10, d)) > 1e-6) d++;
  return { labels: ticks.map(v => { const s = (v / sc).toFixed(d); return /^-0(\.0*)?$/.test(s) ? s.slice(1) : s; }), e };
}

function drawExp(ctx, x, y, e, fs, align) {
  // dibuja  ×10^e  (con superíndice)
  const base = '×10', sup = String(e).replace('-', '−');
  ctx.font = `${fs}px ${FONT}`;
  const wb = ctx.measureText(base).width;
  ctx.font = `${Math.round(fs * 0.72)}px ${FONT}`;
  const ws = ctx.measureText(sup).width;
  const x0 = align === 'right' ? x - wb - ws : x;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `${fs}px ${FONT}`; ctx.fillText(base, x0, y);
  ctx.font = `${Math.round(fs * 0.72)}px ${FONT}`; ctx.fillText(sup, x0 + wb + 1, y - fs * 0.42);
}

// Marco de ejes al estilo MATLAB; devuelve la geometría y las funciones de escala
function plotFrame(cv, o) {
  const { ctx, w, h } = setupCanvas(cv);
  const fs = w > 1100 ? 18 : w > 600 ? 17 : 15;          // rótulos grandes
  const fsT = fs + 3;
  ctx.font = `${fs}px ${FONT}`;
  const plotH = h - fs * 7, plotW = w - fs * 9;
  const yt = o.noTicks ? { ticks: [], step: 1 } : niceTicks(o.ylim[0], o.ylim[1], Math.max(3, Math.floor(plotH / 55)));
  const xt = o.noTicks ? { ticks: [], step: 1 } : niceTicks(o.xlim[0], o.xlim[1], Math.max(3, Math.floor(plotW / 105)));
  const yf = tickFormat(yt.ticks, yt.step), xf = o.xInt ? { labels: xt.ticks.map(v => String(Math.round(v))), e: 0 } : tickFormat(xt.ticks, xt.step);
  ctx.font = `${fs}px ${FONT}`;
  const ylw = Math.max(0, ...yf.labels.map(s => ctx.measureText(s).width));
  const L = 14 + (o.ylabel ? fs * 1.5 : 0) + ylw + 10;
  const R = fs * 1.6;
  const T = (o.title ? fsT * 1.9 : fs) + (yf.e ? fs * 0.9 : 0);
  const B = fs * 1.9 + (o.xlabel ? fs * 1.7 : 0) + (xf.e && !o.xlabel ? fs * 1.3 : 0) + 6;
  const x0 = L, x1 = w - R, y0 = T, y1 = h - B;
  const X = v => x0 + (v - o.xlim[0]) / (o.xlim[1] - o.xlim[0]) * (x1 - x0);
  const Y = v => y1 - (v - o.ylim[0]) / (o.ylim[1] - o.ylim[0]) * (y1 - y0);

  // título
  if (o.title) {
    ctx.fillStyle = '#111'; ctx.font = `600 ${fsT}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(o.title, (x0 + x1) / 2, fsT * 1.25, w - 20);
  }
  // datos (recortados al recuadro)
  if (o.draw) {
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    o.draw(ctx, X, Y, { x0, x1, y0, y1 });
    ctx.restore();
  }
  // recuadro y marcas
  ctx.strokeStyle = '#262626'; ctx.lineWidth = 1;
  ctx.strokeRect(Math.round(x0) + 0.5, Math.round(y0) + 0.5, Math.round(x1 - x0), Math.round(y1 - y0));
  ctx.fillStyle = '#262626'; ctx.font = `${fs}px ${FONT}`;
  const tl = 6;
  ctx.beginPath();
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  xt.ticks.forEach((v, i) => {
    const px = Math.round(X(v)) + 0.5;
    ctx.moveTo(px, y1); ctx.lineTo(px, y1 - tl); ctx.moveTo(px, y0); ctx.lineTo(px, y0 + tl);
    ctx.fillText(xf.labels[i], px, y1 + 6);
  });
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  yt.ticks.forEach((v, i) => {
    const py = Math.round(Y(v)) + 0.5;
    ctx.moveTo(x0, py); ctx.lineTo(x0 + tl, py); ctx.moveTo(x1, py); ctx.lineTo(x1 - tl, py);
    ctx.fillText(yf.labels[i], x0 - 8, py);
  });
  ctx.stroke();
  // exponentes comunes
  if (yf.e) drawExp(ctx, x0, y0 - 7, yf.e, fs, 'left');
  if (xf.e) drawExp(ctx, x1, o.xlabel ? h - 10 : y1 + fs * 2.9, xf.e, fs, 'right');
  // rótulos de ejes
  ctx.font = `${fs + 1}px ${FONT}`; ctx.fillStyle = '#111';
  if (o.xlabel) { ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(o.xlabel, (x0 + x1) / 2, h - 10); }
  if (o.ylabel) {
    ctx.save(); ctx.translate(14 + fs * 0.6, (y0 + y1) / 2); ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(o.ylabel, 0, 0); ctx.restore();
  }
  return { ctx, w, h, X, Y, x0, x1, y0, y1, xlim: o.xlim };
}

function emptyPlot(cv, title, msg) {
  const lay = plotFrame(cv, { title, xlim: [0, 1], ylim: [0, 1], noTicks: true });
  const { ctx, x0, x1, y0, y1 } = lay;
  ctx.fillStyle = '#888'; ctx.font = `17px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(msg, (x0 + x1) / 2, (y0 + y1) / 2, x1 - x0 - 20);
  return lay;
}

// ---------------- Gráfico superior: plot(datos(:,1)) + ginput ----------------
const TOP_TITLE = 'Pincha en un máximo, luego en el máximo siguiente y finalmente pulsa la tecla Enter';

function drawTop() {
  if (!V) { topLay = emptyPlot(cvTop, TOP_TITLE, 'Abre un archivo .txt (botón de arriba o arrastrándolo a la ventana)'); return; }
  const i0 = Math.max(0, Math.floor(view.x0) - 2), i1 = Math.min(N - 1, Math.ceil(view.x1));
  let mn = Infinity, mx = -Infinity;
  for (let i = i0; i <= i1; i++) { const v = V[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
  const ylim = niceLimits(mn, mx);
  topLay = plotFrame(cvTop, {
    title: TOP_TITLE, xlim: [view.x0, view.x1], ylim, xInt: true,
    draw(ctx, X, Y, b) {
      // curva
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1.2; ctx.lineJoin = 'round';
      const n = i1 - i0 + 1, pxw = b.x1 - b.x0;
      ctx.beginPath();
      if (n <= pxw * 3) {
        for (let i = i0; i <= i1; i++) { const px = X(i + 1), py = Y(V[i]); i === i0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
      } else {
        const nc = Math.ceil(pxw); let first = true;
        for (let c = 0; c < nc; c++) {
          const a = i0 + Math.floor(c * n / nc), e = Math.min(i1, i0 + Math.floor((c + 1) * n / nc) - 1);
          if (e < a) continue;
          let lo = Infinity, hi = -Infinity;
          for (let i = a; i <= e; i++) { const v = V[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
          const px = X(a + 1);
          if (first) { ctx.moveTo(px, Y(V[a])); first = false; }
          ctx.lineTo(px, Y(lo)); ctx.lineTo(px, Y(hi)); ctx.lineTo(X(e + 1), Y(V[e]));
        }
      }
      ctx.stroke();
      // ciclo seleccionado
      if (picks.length >= 2) {
        const [a, c] = selRange();
        ctx.fillStyle = 'rgba(31,95,191,0.07)';
        ctx.fillRect(X(a), b.y0, X(c) - X(a), b.y1 - b.y0);
      }
      // puntos pinchados
      picks.forEach((p, k) => {
        const idx = Math.min(N, Math.max(1, Math.round(p))), px = Math.round(X(idx)) + 0.5;
        ctx.strokeStyle = '#1f5fbf'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(px, b.y0); ctx.lineTo(px, b.y1); ctx.stroke();
        ctx.fillStyle = '#1f5fbf'; ctx.beginPath(); ctx.arc(px, Y(V[idx - 1]), 4.5, 0, 2 * Math.PI); ctx.fill();
        ctx.font = `600 16px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillText('i' + (k + 1) + ' = ' + idx, px + 6, b.y1 - 6);
      });
      // cursor
      if (hoverX !== null) {
        const idx = Math.min(N, Math.max(1, Math.round(hoverX))), px = Math.round(X(idx)) + 0.5;
        ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(px, b.y0); ctx.lineTo(px, b.y1); ctx.stroke();
        ctx.fillStyle = '#555'; ctx.font = `16px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
        ctx.fillText('índice ' + idx, b.x1 - 8, b.y0 + 6);
      }
    }
  });
}

function selRange() {
  let a = Math.round(picks[0]), c = Math.round(picks[1]);
  if (a > c) [a, c] = [c, a];
  return [Math.max(1, a), Math.min(N, c)];
}

// ---------------- Gráficos inferiores: P-V original y suavizado ----------------
function drawBottom() {
  if (!result) {
    const msg = V ? 'Selecciona un ciclo arriba y pulsa Enter' : '';
    emptyPlot(cvA, 'Área datos originales', msg);
    emptyPlot(cvB, 'Área datos suavizados', msg);
    return;
  }
  const r = result;
  const lim = arr => { let a = Infinity, b = -Infinity; for (const v of arr) { if (v < a) a = v; if (v > b) b = v; } return niceLimits(a, b); };
  const pv = (cv, x, y, area, title) => plotFrame(cv, {
    title: title + ' = ' + num2str4(area) + ' J',
    xlabel: 'V (m³)', ylabel: 'P (Pa)', xlim: lim(x), ylim: lim(y),
    draw(ctx, X, Y) {
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1.2; ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < x.length; i++) { const px = X(x[i]), py = Y(y[i]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();
    }
  });
  pv(cvA, r.v, r.p, r.area, 'Área datos originales');
  pv(cvB, r.vs, r.ps, r.areaS, 'Área datos suavizados');
}

// ---------------- Cálculo (lo que hace el script tras ginput) ----------------
function calcular() {
  if (!V || picks.length < 2) return;
  const [a, c] = selRange();                     // datos_ciclo = datos(i1:i2,:)
  const v = V.slice(a - 1, c), p = P.slice(a - 1, c);
  const span = Math.max(1, parseInt($('span').value, 10) || 100);
  const vs = smoothMA(v, span), ps = smoothMA(p, span);
  result = { a, c, v, p, vs, ps, area: polyarea(v, p), areaS: polyarea(vs, ps) };
  drawBottom();
  setInfo();
}

// ---------------- Carga de datos y columnas ----------------
function applyColumns() {
  if (!cols) return;
  const nc = cols.length;
  const cv = parseInt($('colV').value, 10), cp = parseInt($('colP').value, 10);
  if (!(cv >= 1 && cv <= nc) || !(cp >= 1 && cp <= nc)) {
    V = P = null; N = 0; result = null;
    $('info').textContent = `El archivo tiene ${nc} columnas numéricas: elige columnas entre 1 y ${nc}.`;
    redraw(); return;
  }
  N = cols[0].length;
  V = new Float64Array(N); P = new Float64Array(N);
  for (let i = 0; i < N; i++) { V[i] = cols[cv - 1][i] * FACT_V; P[i] = cols[cp - 1][i] * FACT_P; }
  if (picks.length >= 2) calcular(); else result = null;
  setInfo(); redraw();
}

function loadText(text, name) {
  try {
    cols = parseFile(text);
  } catch (err) {
    cols = null; V = P = null; N = 0; result = null;
    $('fname').textContent = name;
    $('info').textContent = 'No se pudo leer el archivo: ' + err.message;
    redraw(); return;
  }
  $('fname').textContent = name; $('fname').title = name;
  picks = []; result = null;
  N = cols[0].length; view = { x0: 1, x1: Math.max(2, N) };
  ['bAll', 'bClr'].forEach(id => $(id).disabled = false);
  applyColumns();
}

function setInfo() {
  if (!V) return;
  let s = `${N} puntos, ${cols.length} columnas numéricas. V = col. ${$('colV').value} × 2.4·10⁻⁹ m³/mV, P = col. ${$('colP').value} × 32.9 Pa/mV.`;
  if (picks.length === 1) s += '   Pincha en el máximo siguiente.';
  if (picks.length >= 2) {
    const [a, c] = selRange();
    s += `   Ciclo: índices ${a} a ${c} (${c - a + 1} puntos).`;
    if (!result || result.a !== a || result.c !== c) s += ' Pulsa Enter para calcular.';
  }
  $('info').textContent = s;
  $('bCalc').disabled = picks.length < 2;
}

function redraw() { drawTop(); drawBottom(); }

// ---------------- Interacción ----------------
$('bOpen').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ''; };
function readFile(f) { const rd = new FileReader(); rd.onload = () => loadText(rd.result, f.name); rd.readAsText(f); }

$('colV').onchange = $('colP').onchange = applyColumns;
$('span').onchange = () => { if (result) calcular(); };
$('bCalc').onclick = calcular;
$('bClr').onclick = () => { picks = []; result = null; setInfo(); redraw(); };
$('bAll').onclick = () => { if (V) { view = { x0: 1, x1: Math.max(2, N) }; drawTop(); } };

document.addEventListener('keydown', e => {
  const inInput = e.target.tagName === 'INPUT';
  if (e.key === 'Enter') { if (inInput) e.target.blur(); e.preventDefault(); calcular(); }
  else if ((e.key === 'Backspace' || e.key === 'Delete') && !inInput && picks.length) {
    e.preventDefault(); picks.pop(); result = null; setInfo(); redraw();   // como en ginput
  }
  else if (e.key === 'Escape' && picks.length) { picks = []; result = null; setInfo(); redraw(); }
});

// arrastrar archivo a la ventana
let dragN = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('drop').style.display = 'flex'; });
window.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('drop').style.display = 'none'; } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); dragN = 0; $('drop').style.display = 'none';
  const f = e.dataTransfer.files[0]; if (f) readFile(f);
});

// gráfico superior: clic = punto de ginput; arrastrar = desplazar; rueda / dos dedos = zoom en el puntero
function dataX(ev) {
  const r = cvTop.getBoundingClientRect(), px = ev.clientX - r.left;
  if (!topLay || px < topLay.x0 || px > topLay.x1) return null;
  return view.x0 + (px - topLay.x0) / (topLay.x1 - topLay.x0) * (view.x1 - view.x0);
}
let drag = null;
cvTop.addEventListener('pointerdown', e => {
  if (!V) return;
  drag = { sx: e.clientX, v0: { ...view }, moved: false };
  cvTop.setPointerCapture(e.pointerId);
});
cvTop.addEventListener('pointermove', e => {
  if (!V) return;
  if (drag) {
    const dx = e.clientX - drag.sx;
    if (Math.abs(dx) > 4) drag.moved = true;
    if (drag.moved && topLay) {
      const w = drag.v0.x1 - drag.v0.x0;
      let x0 = drag.v0.x0 - dx / (topLay.x1 - topLay.x0) * w;
      x0 = Math.max(1, Math.min(Math.max(2, N) - w, x0));
      view = { x0, x1: x0 + w };
      cvTop.style.cursor = 'grabbing';
    }
  }
  hoverX = dataX(e);
  drawTop();
});
cvTop.addEventListener('pointerup', e => {
  if (!V || !drag) return;
  const moved = drag.moved; drag = null; cvTop.style.cursor = 'crosshair';
  if (moved) return;
  const x = dataX(e); if (x === null) return;
  if (picks.length >= 2) { picks = []; result = null; }
  picks.push(x);
  setInfo(); redraw();
});
cvTop.addEventListener('pointerleave', () => { hoverX = null; if (!drag) drawTop(); });
cvTop.addEventListener('wheel', e => {
  if (!V) return;
  e.preventDefault();
  const x = dataX(e); if (x === null) return;
  const f = Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0015));
  const full = Math.max(2, N) - 1;
  let w = Math.min(full, Math.max(10, (view.x1 - view.x0) * f));
  const t = (x - view.x0) / (view.x1 - view.x0);
  let x0 = x - t * w;
  x0 = Math.max(1, Math.min(1 + full - w, x0));
  view = { x0, x1: x0 + w };
  hoverX = x; drawTop();
}, { passive: false });

new ResizeObserver(() => redraw()).observe(document.querySelector('main'));
redraw();
</script>
</body>
</html>
